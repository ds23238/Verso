[package]
name = "lyricsfile"
version = "0.1.0"
edition = "2021"
authors = ["GPT 6.1 Sol <gpt_6_1_sol@localhost>"]
description = "Validated Lyricsfile 1.0 draft model and YAML support"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
node = ["dep:napi", "dep:napi-derive"]
wasm = ["dep:wasm-bindgen"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
napi = { version = "2", optional = true, default-features = false, features = ["napi6"] }
napi-derive = { version = "2", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
