<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1110" viewBox="0 0 1500 1110" role="img" aria-labelledby="title desc"><title id="title">Verso UI Blueprint – save-review</title><desc id="desc">Statischer Speicherdialog für Verso Audio. Drei explizite Ziele: FLAC-Kopie mit Tag-Änderungen, E-LRC-Begleitdatei und Lyricsfile-Begleitdatei. Änderungsübersicht inklusive Frontcover-Vorher/Nachher und Erhalt des zweiten Bildes, Hinweis auf fehlende Endzeiten im E-LRC-Export und abgeschaltete Option für benutzerdefinierte Lyricsfile-Einbettung. Keine Datei wurde bereits geschrieben.</desc><rect x="0" y="0" width="1500" height="1110" rx="0" fill="#F4F5F1"/><text x="40" y="20" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="700" fill="#536861">VERSO AUDIO / BLUEPRINT 02 · ÄNDERUNGEN UND SPEICHERZIELE</text><text x="40" y="56" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="700" fill="#172D2B">verso</text><text x="221" y="69" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#536861">Text konvertieren</text><rect x="383" y="58" width="138" height="36" rx="8" fill="#E6F2EC"/><text x="401" y="69" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#146B59">Audio-Datei</text><circle cx="1182" cy="77" r="4" fill="#146B59"/><text x="1194" y="69" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="400" fill="#536861">Lokal verarbeitet</text><rect x="1351" y="57" width="109" height="38" rx="8" fill="#FFFFFF" stroke="#D8E1DA"/><text x="1365" y="69.0" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#172D2B">Hilfe</text><path d="M40 111 L1460 111" stroke="#D8E1DA" stroke-width="1"/><text x="40" y="142" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#172D2B">Deine Änderungen. Klare Ziele.</text><text x="41" y="188" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#536861">Du entscheidest, was ins Audio geschrieben wird und was als Begleitdatei entsteht.</text><rect x="40" y="232" width="903" height="56" rx="10" fill="#E6F2EC"/><text x="59" y="252" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#146B59">Neue Audiokopie</text><text x="271" y="253" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#536861">Original ersetzen</text><text x="669" y="253" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="400" fill="#146B59">Original bleibt unverändert.</text><rect x="40" y="307" width="903" height="137" rx="12" fill="#FFFFFF" stroke="#D8E1DA"/><rect x="60" y="330" width="19" height="19" rx="4" fill="#146B59"/><text x="64" y="332" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">✓</text><text x="94" y="330" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#172D2B">Audiokopie mit bearbeiteten Tags</text><text x="94" y="361" dominant-baseline="text-before-edge" font-family="DejaVu Sans Mono, sans-serif" font-size="16" font-weight="700" fill="#146B59">abendlicht.verso.flac</text><text x="94" y="393" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#536861">Album, Genre und Frontcover aktualisieren · Audiostrom nicht neu kodieren.</text><text x="94" y="416" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="400" fill="#536861">Plain-Lyrics aus dem gewählten Entwurf im Audio aktualisieren: aktiviert</text><rect x="40" y="460" width="903" height="137" rx="12" fill="#FFFFFF" stroke="#D8E1DA"/><rect x="60" y="483" width="19" height="19" rx="4" fill="#146B59"/><text x="64" y="485" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">✓</text><text x="94" y="483" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#172D2B">LRC-Begleitdatei</text><text x="94" y="514" dominant-baseline="text-before-edge" font-family="DejaVu Sans Mono, sans-serif" font-size="16" font-weight="700" fill="#146B59">abendlicht.verso.lrc</text><text x="94" y="546" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#536861">Profil: E-LRC · vorhandene Zeilen- und Wortanfänge erhalten.</text><text x="94" y="569" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="400" fill="#536861">Keine zusätzlichen Zeitmarken erzeugen.</text><rect x="40" y="613" width="903" height="137" rx="12" fill="#FFFFFF" stroke="#D8E1DA"/><rect x="60" y="636" width="19" height="19" rx="4" fill="#146B59"/><text x="64" y="638" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">✓</text><text x="94" y="636" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#172D2B">Lyricsfile-Begleitdatei</text><text x="94" y="667" dominant-baseline="text-before-edge" font-family="DejaVu Sans Mono, sans-serif" font-size="16" font-weight="700" fill="#146B59">abendlicht.verso.lyricsfile.yaml</text><text x="94" y="699" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#536861">Vollständigen Lyrics-Entwurf mit vorhandenen Endzeiten speichern.</text><text x="94" y="722" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="400" fill="#536861">Lyricsfile-Metadaten an die bearbeiteten Track-Tags angleichen: aktiviert</text><rect x="969" y="232" width="491" height="390" rx="12" fill="#FFFFFF" stroke="#D8E1DA"/><text x="990" y="255" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="700" fill="#536861">ÄNDERUNGEN PRÜFEN</text><text x="990" y="283" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#172D2B">Vorher und nachher.</text><text x="990" y="330" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#536861">Album</text><text x="1114" y="330" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#172D2B">Proben → Nachtschicht</text><text x="990" y="372" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#536861">Genre</text><text x="1114" y="372" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#172D2B">Pop → Indie-Pop</text><text x="990" y="414" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#536861">Lyrics</text><text x="1114" y="414" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#172D2B">Entwurf aus Lyricsfile</text><text x="1114" y="437" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="400" fill="#536861">Plain im neuen Audio aktualisieren</text><text x="990" y="484" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#536861">Frontcover</text><rect x="1114" y="470" width="49" height="49" rx="8" fill="#B58D62"/><circle cx="1148.3" cy="484.21" r="6.37" fill="#E5CDA1"/><rect x="1114" y="498.42" width="49" height="20.58" rx="0" fill="#84674D"/><text x="1181" y="485" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#536861">→</text><rect x="1221" y="470" width="49" height="49" rx="8" fill="#244F46"/><circle cx="1255.3" cy="484.21" r="6.37" fill="#BDD3BB"/><rect x="1221" y="498.42" width="49" height="20.58" rx="0" fill="#183D36"/><text x="1285" y="480" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#172D2B">Ersetzen</text><text x="1285" y="501" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="400" fill="#536861">Bild 2 erhalten</text><path d="M991 553 L1438 553" stroke="#D8E1DA" stroke-width="1"/><text x="990" y="576" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#536861">Die ursprüngliche FLAC-Datei und ihre</text><text x="990" y="596" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#536861">Begleitdateien bleiben erhalten.</text><rect x="969" y="642" width="491" height="173" rx="12" fill="#FFF4DB"/><text x="991" y="665" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#805711">Ein Unterschied bleibt wichtig.</text><text x="991" y="700" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#805711">Der E-LRC-Export übernimmt hier Anfangszeiten,</text><text x="991" y="722" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#805711">aber keine expliziten Endzeiten. Im Lyricsfile</text><text x="991" y="744" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#805711">bleiben diese vollständig erhalten.</text><text x="991" y="780" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="400" fill="#805711">Die Audiodatei wird dafür nicht neu kodiert.</text><rect x="40" y="844" width="1420" height="107" rx="12" fill="#FFFFFF" stroke="#D8E1DA"/><text x="61" y="864" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="700" fill="#536861">WEITERE OPTIONEN</text><text x="61" y="895" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#172D2B">Lyricsfile zusätzlich in einem eigenen Audiotag ablegen</text><text x="61" y="920" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="400" fill="#536861">Standardmäßig aus · Verso-Profil, keine allgemeine Player-Unterstützung zugesichert.</text><rect x="1362" y="887" width="65" height="31" rx="16" fill="#E8EDE6"/><circle cx="1378" cy="902" r="12" fill="#FFFFFF"/><path d="M40 981 L1460 981" stroke="#D8E1DA" stroke-width="1"/><text x="41" y="1004" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#536861">Noch keine Datei geschrieben. Alle Ziele werden vor dem Schreiben geprüft.</text><rect x="1114" y="1000" width="102" height="46" rx="8" fill="#FFFFFF" stroke="#D8E1DA"/><text x="1128" y="1015.5" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#172D2B">Zurück</text><rect x="1232" y="1000" width="228" height="46" rx="8" fill="#146B59"/><text x="1246" y="1015.5" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">3 Dateien speichern</text><text x="40" y="1071" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="700" fill="#536861">DESIGNENTWURF · Keine bereits implementierte Audio-/Tag-Funktion</text></svg>